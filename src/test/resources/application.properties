# 测试环境使用 H2 内存数据库（MySQL 兼容模式）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatis 驼峰映射
mybatis.configuration.map-underscore-to-camel-case=true

app.security.jwt-secret-base64=dGVzdC1vbmx5LWtleS1uZXZlci11c2UtaW4tcHJvZHVjdGlvbi0wMDA=
app.security.secure-cookies=false
app.security.access-seconds=900
app.security.refresh-seconds=604800
# Fixtures are loaded per test; the background cache job must not race their creation.
app.recommend.initial-delay-ms=3600000
