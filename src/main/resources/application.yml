spring:
  application:
    name: EbookRecommendSystem
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ebook_recommend_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8081}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    secure-cookies: ${COOKIE_SECURE:true}
    access-seconds: ${JWT_ACCESS_SECONDS:900}
    refresh-seconds: ${JWT_REFRESH_SECONDS:604800}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
