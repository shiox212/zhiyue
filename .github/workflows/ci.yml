name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'practice/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests and package
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload backend artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Production build
        run: npm run build
      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frontend artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check tracked file paths
        run: node scripts/check-repository.mjs
